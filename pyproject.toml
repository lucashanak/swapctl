[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "swapctl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "huggingface_hub>=0.24",
    "ruamel.yaml>=0.18",
    "jinja2",
    "python-multipart",
    "httpx",
    "requests",
    "itsdangerous",
    "markdown-it-py",
]

[project.scripts]
swapctl = "app.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
