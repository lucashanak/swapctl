{% extends "base.html" %}
{% block title %}Installing - swapctl{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-2">Installing</h1>
<p class="text-sm text-slate-400 mb-6 font-mono break-all">job {{ job_id }}</p>

<div class="bg-slate-800 rounded-lg shadow p-6">
  <div id="job-status"
       hx-get="{{ root_path }}/api/jobs/{{ job_id }}"
       hx-trigger="load, every 2s"
       hx-headers='{"Accept": "text/html"}'
       hx-swap="innerHTML">
    <div class="text-slate-400 text-sm">Starting...</div>
  </div>
</div>

<div class="mt-4">
  <a href="{{ root_path }}/jobs" class="text-sm text-slate-400 hover:text-slate-200">&larr; Back to jobs</a>
</div>
{% endblock %}
